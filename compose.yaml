services:
  server:
    build:
      context: .
    ports:
      - 3000:3000
    depends_on:
      mongo:
        condition: service_completed_successfully

  mongo:
    image: mongo:latest
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: gestorDB
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
